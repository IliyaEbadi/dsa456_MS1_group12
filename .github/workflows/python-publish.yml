name: Project Runner

on:
  workflow_dispatch:

jobs:
  run-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run project
        run: python ms1Prototype.py
